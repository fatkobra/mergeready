[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mergeready"
version = "0.1.0"
description = "Evidence-backed reports showing where pull requests lose time and what is slowing delivery."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mergeready = "mergeready.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
